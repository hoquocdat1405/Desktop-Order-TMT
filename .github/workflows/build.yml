name: Build Mac DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Build Electron DMG for Mac
        env:
          ELECTRON_BUILD: 'true'
        run: npx electron-builder --mac dmg --config.mac.identity=null

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer-DMG
          path: dist/*.dmg